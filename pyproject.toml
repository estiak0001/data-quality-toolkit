[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqtk"
version = "0.1.0"
description = "A pluggable data quality and observability toolkit: freshness, row-count, null-rate and schema-drift checks over SQL warehouses, with run-history persistence and Slack/email alerting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
    "clickhouse-connect>=0.7.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.33"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dqtk = "dqtk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
